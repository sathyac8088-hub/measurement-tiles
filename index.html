<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housewarming Invitation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="invitation-header">
            <h1 class="title">Housewarming Ceremony</h1>
            <p class="subtitle">New Home, New Memories</p>
        </header>

        <main>
            <section class="details-card">
                <div class="message">
                    <p>We cordially invite you to share our joy as we step into our new home. Your presence will make our house a home.</p>
                </div>

                <div class="info">
                    <div class="info-item">
                        <h3>When</h3>
                        <p id="event-date">Saturday, November 18, 2023</p>
                        <p>5:00 PM onwards</p>
                    </div>
                    <div class="info-item">
                        <h3>Where</h3>
                        <p>123 Maple Avenue</p>
                        <p>Springfield, IL 62704</p>
                    </div>
                </div>

                <div class="rsvp-section">
                    <h2>RSVP</h2>
                    <form id="rsvp-form">
                        <div class="form-group">
                            <input type="text" id="name" name="name" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <select id="guests" name="guests">
                                <option value="1">1 Guest</option>
                                <option value="2">2 Guests</option>
                                <option value="3">3 Guests</option>
                                <option value="4">4 Guests</option>
                                <option value="5+">5+ Guests</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">I'll be there!</button>
                    </form>
                    <p id="feedback-message" class="hidden"></p>
                </div>
            </section>
        </main>

        <footer>
            <p>We can't wait to see you!</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
